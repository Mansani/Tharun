name: Daily .NET Azure Job Assistant
on:
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: daily-job-assistant
  cancel-in-progress: false
jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: job_search/requirements.txt
      - name: Install
        run: pip install -r job_search/requirements.txt
      - name: Search and score
        env:
          GREENHOUSE: ${{ vars.GREENHOUSE }}
          LEVER: ${{ vars.LEVER }}
          MIN_SCORE: ${{ vars.MIN_SCORE || '60' }}
        run: python job_search/agent.py
      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: daily-job-report
          path: out/
          retention-days: 30
      - name: Save report
        run: |
          git config user.name "job-agent-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add out/
          git commit -m "Update daily job report [skip ci]" || exit 0
          git push
